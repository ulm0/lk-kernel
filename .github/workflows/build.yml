# Kernels for natkit, yagan and limakit (flavors/<flavor>), version in VERSION.
#   kernel    one job per flavor and architecture: <flavor>:<version>-<hash>-<arch>, rebuilt only when build.sh or
#             the flavor's configs change (the hash); a fork's PR builds without pushing
#   manifest  main: <flavor>:<version>-<hash> and <flavor>:<version>, multi-arch where the flavor is
# Consumers pin <flavor>:<version>@sha256:<digest>, so a new build reaches them only through their own (Renovate) PR.
name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io/ulm0/lk-kernel

jobs:
  lint:
    runs-on: ubuntu-26.04-arm
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: shellcheck -S warning build.sh

  kernel:
    needs: lint
    strategy:
      fail-fast: false
      matrix:
        include:
          - { flavor: natkit, arch: arm64, runner: ubuntu-26.04-arm }
          - { flavor: natkit, arch: amd64, runner: ubuntu-26.04 }
          - { flavor: yagan, arch: arm64, runner: ubuntu-26.04-arm }
          - { flavor: limakit, arch: arm64, runner: ubuntu-26.04-arm }
    name: kernel (${{ matrix.flavor }}, ${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: bin
          key: linuxkit-${{ runner.arch }}-${{ hashFiles('Makefile') }}
          restore-keys: linuxkit-${{ runner.arch }}-
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: key
        run: |
          version=$(cat VERSION)
          hash=$(cat build.sh flavors/${{ matrix.flavor }}/*.config | sha256sum | cut -c1-12)
          { echo "version=$version"; echo "image=$REGISTRY/${{ matrix.flavor }}:$version-$hash-${{ matrix.arch }}"; } >>"$GITHUB_OUTPUT"
      - id: cached
        run: docker manifest inspect "${{ steps.key.outputs.image }}" >/dev/null 2>&1 && echo hit=true >>"$GITHUB_OUTPUT" || true
      - if: steps.cached.outputs.hit != 'true'
        run: |
          make ${{ matrix.flavor }}
          # the label records the commit that built it (on a PR, its head commit: github.sha is the merge commit)
          echo "FROM $REGISTRY/${{ matrix.flavor }}:${{ steps.key.outputs.version }}" | docker build -q -t "${{ steps.key.outputs.image }}" \
            --label org.opencontainers.image.revision=${{ github.event.pull_request.head.sha || github.sha }} \
            --label org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }} \
            --label "org.opencontainers.image.description=LinuxKit kernel ${{ steps.key.outputs.version }}, ${{ matrix.flavor }} flavor" -
          [ "${{ github.event.pull_request.head.repo.fork }}" = true ] || docker push "${{ steps.key.outputs.image }}"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always() && steps.cached.outputs.hit != 'true'
        with:
          name: config-${{ matrix.flavor }}-${{ matrix.arch }}
          path: flavors/${{ matrix.flavor }}/config-*
          if-no-files-found: ignore

  manifest:
    needs: kernel
    if: github.ref == 'refs/heads/main'
    strategy:
      matrix:
        include:
          - { flavor: natkit, arches: arm64 amd64 }
          - { flavor: yagan, arches: arm64 }
          - { flavor: limakit, arches: arm64 }
    name: manifest (${{ matrix.flavor }})
    runs-on: ubuntu-26.04-arm
    timeout-minutes: 5
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - run: |
          version=$(cat VERSION)
          hash=$(cat build.sh flavors/${{ matrix.flavor }}/*.config | sha256sum | cut -c1-12)
          set --
          for a in ${{ matrix.arches }}; do set -- "$@" "$REGISTRY/${{ matrix.flavor }}:$version-$hash-$a"; done
          docker buildx imagetools create -t "$REGISTRY/${{ matrix.flavor }}:$version" -t "$REGISTRY/${{ matrix.flavor }}:$version-$hash" "$@"
          docker buildx imagetools inspect "$REGISTRY/${{ matrix.flavor }}:$version" --format '{{json .Manifest.Digest}}' |
            xargs -I{} echo "### ${{ matrix.flavor }}:$version@{}" >>"$GITHUB_STEP_SUMMARY"
