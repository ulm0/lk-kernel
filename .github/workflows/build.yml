# One LinuxKit kernel for natkit, yagan and limakit (config/), version in VERSION, for arm64 and amd64.
#   kernel    one job per architecture: lk-kernel:<version>-<hash>-<arch>, rebuilt only when build.sh or config/
#             change (the hash); a fork's PR builds without pushing
#   manifest  main: the multi-arch lk-kernel:<version>-<hash> and lk-kernel:<version>
# Consumers pin lk-kernel:<version>@sha256:<digest>, so a new build reaches them only through their own (Renovate) PR.
name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/ulm0/lk-kernel

jobs:
  lint:
    runs-on: ubuntu-26.04-arm
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: shellcheck -S warning build.sh

  kernel:
    needs: lint
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: arm64, runner: ubuntu-26.04-arm }
          - { arch: amd64, runner: ubuntu-26.04 }
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: bin
          key: linuxkit-${{ runner.arch }}-${{ hashFiles('Makefile') }}
          restore-keys: linuxkit-${{ runner.arch }}-
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: key
        run: |
          version=$(cat VERSION)
          hash=$(cat build.sh config/*.config | sha256sum | cut -c1-12)
          { echo "version=$version"; echo "image=$IMAGE:$version-$hash-${{ matrix.arch }}"; } >>"$GITHUB_OUTPUT"
      - id: cached
        run: docker manifest inspect "${{ steps.key.outputs.image }}" >/dev/null 2>&1 && echo hit=true >>"$GITHUB_OUTPUT" || true
      - if: steps.cached.outputs.hit != 'true'
        run: |
          make kernel
          # the label records the commit that built it (on a PR, its head commit: github.sha is the merge commit)
          echo "FROM $IMAGE:${{ steps.key.outputs.version }}" | docker build -q -t "${{ steps.key.outputs.image }}" \
            --label org.opencontainers.image.revision=${{ github.event.pull_request.head.sha || github.sha }} \
            --label org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }} \
            --label "org.opencontainers.image.description=LinuxKit kernel ${{ steps.key.outputs.version }} for natkit, yagan and limakit" -
          [ "${{ github.event.pull_request.head.repo.fork }}" = true ] || docker push "${{ steps.key.outputs.image }}"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always() && steps.cached.outputs.hit != 'true'
        with:
          name: config-${{ matrix.arch }}
          path: config/config-*
          if-no-files-found: ignore

  manifest:
    needs: kernel
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-26.04-arm
    timeout-minutes: 5
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - run: |
          version=$(cat VERSION)
          hash=$(cat build.sh config/*.config | sha256sum | cut -c1-12)
          docker buildx imagetools create -t "$IMAGE:$version" -t "$IMAGE:$version-$hash" \
            "$IMAGE:$version-$hash-arm64" "$IMAGE:$version-$hash-amd64"
          digest=$(docker buildx imagetools inspect "$IMAGE:$version" --format '{{json .Manifest.Digest}}' | tr -d '"')
          echo "### \`$IMAGE:$version@$digest\`" >>"$GITHUB_STEP_SUMMARY"
